name: assetscope
description: "资观 AssetScope —— 本地优先、端到端加密的个人资产、负债与财务规划系统。"
publish_to: 'none'

version: 0.25.0+27

environment:
  sdk: ^3.12.2

# SQLite3MultipleCiphers 构建配置：让 sqlite3 3.x 的 build hook 产出支持
# SQLCipher 兼容加密的数据库引擎（PRAGMA key）。详见 docs/06-安全设计.md。
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理 / 路由
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0

  meta: ^1.15.0

  # 本地账本（加密 SQLite）
  drift: ^2.35.2
  drift_flutter: ^0.3.1

  # 平台
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0

  # 密码学（sodium 为运行时实现；cryptography 为纯 Dart 后备/测试实现）
  # 精确锁定：4.1 起 pwhash.call 弃用（callStr/callRaw），升级时需同步改 sodium_crypto_suite
  sodium: 4.0.4
  cryptography: ^2.9.0

  # 展示与工具
  intl: ^0.20.2
  fl_chart: ^1.2.0
  uuid: ^4.6.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  fast_gbk: ^1.0.0
  file_selector: ^1.1.0
  window_manager: ^0.5.2
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.15.1
  sqlite3: ^3.5.2
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  generate: true
  # 字体系统（OFL 1.1，见 assets/fonts/README.md）：
  # 全局默认 = Space Grotesk（拉丁/数字）→ NotoSansSC 思源黑体（中文回落）；
  # IBMPlexMono 金额专用（MoneyText）；NotoSerifSC 思源宋体 = 大标题备选。
  # NotoSansSC/SpaceGrotesk 为可变字重，FontWeight.w100–w900 直接映射 wght 轴。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-VF.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VF.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
  assets:
    - assets/globe/land_dots.json
    # 品牌标识（A mark，透明背景矢量）：
    # mark_light.svg = 绿色 #087F6B，配浅色背景（浅色模式）
    # mark_dark.svg = 白色，配深色背景（深色模式）
    - assets/logo/mark_light.svg
    - assets/logo/mark_dark.svg
    # 品牌标识 PNG（应用内展示用；命名同上，light=绿色款 dark=白色款）：
    # mark = 单 A 图形；lockup = A 标 + AssetScope 字标
    - assets/logo/mark_light.png
    - assets/logo/mark_dark.png
    - assets/logo/lockup_light.png
    - assets/logo/lockup_dark.png
